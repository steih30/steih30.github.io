<!DOCTYPE html>

<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Webpage Assignment</title>

	<style>

	</style>
</head>

<body>
	<!-- table with no border -->
	<table>
		<tr>
			<td>Loona Steinhardt</td>
		</tr>

			<!-- Link to school's webpage, into a new tab -->
			<td><a href="https://www.uwgb.edu/" target="_blank">University of Wisconsin-Green Bay main webpage</a></td>
		</tr>

	</table>
	<p>

	</p>
	<br>

	<table class="bordered">
		<tr>
			<th>Interests</th>
			<th>Education</th>		
		</tr>
		<tr>
			<td>
				<ol type="a">
					<li>Reading</li>

				</ol>

			<td>

				</ul>
			</td>
